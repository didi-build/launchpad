name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: npm ci
        id: install
        run: npm ci
        continue-on-error: true
      - name: npm run check
        id: check
        if: steps.install.outcome == 'success'
        run: npm run check
        continue-on-error: true
      - name: Publish test report (Checks tab)
        uses: dorny/test-reporter@fe45e9537387dac839af0d33ba56eed8e24189e8 # v2.3.0
        if: always() && github.event_name == 'pull_request' && steps.install.outcome == 'success'
        with:
          name: Vitest
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: false
      - name: Build PR test summary
        id: summary
        if: always() && github.event_name == 'pull_request'
        run: node scripts/ci-test-summary.mjs >> "$GITHUB_OUTPUT"
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Find PR test results comment
        id: find-comment
        if: always() && github.event_name == 'pull_request'
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- launchpad-vitest-results -->"
      - name: Update PR test results comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        if: always() && github.event_name == 'pull_request'
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: ${{ steps.summary.outputs.body }}
      - name: Fail job if install or check failed
        if: steps.install.outcome != 'success' || steps.check.outcome != 'success'
        run: exit 1
